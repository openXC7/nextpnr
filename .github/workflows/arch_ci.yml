# CI for everything other than the sui generis FPGA interchange arrangements

name: Arch CI tests

on: [push, pull_request]

# One run per branch: a series of pushes, or a push and the pull_request
# of the same branch, leaves only the last. Keyed on repository + branch so
# that a fork's branch never shares a group with a branch here.
concurrency:
  group: arch-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  Build-nextpnr:
    strategy:
      fail-fast: false
      matrix:
        arch: [mistral, ice40, ecp5, generic, nexus, machxo2, himbaechel, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DEPS_PATH: ${{ github.workspace }}/deps
      YOSYS_REVISION: 7045cf509e1d95cbc973746674cf2d7c73c02e50
      ICESTORM_REVISION: 68044cc4dac829729ccd0ee88d0780525b515746
      TRELLIS_REVISION: 36c615d1740473cc3574464c7f0bed44da20e5b6
      PRJOXIDE_REVISION: be5891272a783f6c7d890da7f8dbf663dcaf61f4
      MISTRAL_REVISION: ebfc0dd2cc7d6d2159b641a397c88554840e93c9
      APYCULA_REVISION: 0.8.2a1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # azure.archive.ubuntu.com sometimes sends only a trickle, which never
    # trips Acquire::http::Timeout, and Install ran to its 45 minute
    # cap.  The debs are restored from the Actions cache; a miss downloads
    # under a per-attempt cap and retries on the next mirror.  The list is
    # .github/ci/apt-arch.list, the same file Cache-apt saves on a push to main.
    - name: Apt cache key
      id: apt-key
      timeout-minutes: 10
      run: .github/ci/apt-install.sh key .github/ci/apt-arch.list

    - name: Restore apt packages
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-arch
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-key.outputs.prefix-image }}
          ${{ steps.apt-key.outputs.prefix-os }}

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Compiler cache: ccache's directory is saved to and restored from the
    # Actions cache per architecture, so a rebuild of an unchanged file is a
    # hash lookup. CMake picks the launcher up automatically (USE_CCACHE=ON).
    # CCACHE_REMOTE_STORAGE is optional: set the secret to a redis:// or
    # http:// store to share results beyond this repository's Actions cache;
    # empty means local only.
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ matrix.arch }}
        max-size: 500M
    - name: Install
      timeout-minutes: 35
      run: .github/ci/apt-install.sh install .github/ci/apt-arch.list "${{ runner.temp }}/apt-arch"

    - name: Cache yosys installation
      uses: actions/cache@v4
      id: cache-yosys
      with:
        path: .yosys
        key: cache-yosys-${{ env.YOSYS_REVISION }}-r3

    - name: Build yosys
      run: |
        source ./.github/ci/build_common.sh
        build_yosys
      if: steps.cache-yosys.outputs.cache-hit != 'true'

    - name: Cache icestorm installation
      uses: actions/cache@v4
      id: cache-icestorm
      with:
        path: .icestorm
        key: cache-icestorm-${{ env.ICESTORM_REVISION }}-r3
      if: matrix.arch == 'ice40'

    - name: Build icestorm
      run: |
        source ./.github/ci/build_common.sh
        build_icestorm
      if: matrix.arch == 'ice40' && steps.cache-icestorm.outputs.cache-hit != 'true'

    - name: Cache trellis installation
      uses: actions/cache@v4
      id: cache-trellis
      with:
        path: .trellis
        key: cache-trellis-${{ env.TRELLIS_REVISION }}-r3
      if: matrix.arch == 'ecp5' || matrix.arch == 'machxo2'

    - name: Build trellis
      run: |
        source ./.github/ci/build_common.sh
        build_trellis
      if: (matrix.arch == 'ecp5' || matrix.arch == 'machxo2') && steps.cache-trellis.outputs.cache-hit != 'true'

    - name: Cache prjoxide installation
      uses: actions/cache@v4
      id: cache-prjoxide
      with:
        path: .prjoxide
        key: cache-prjoxide-${{ env.PRJOXIDE_REVISION }}-r3
      if: matrix.arch == 'nexus'

    - name: Build prjoxide
      run: |
        source ./.github/ci/build_common.sh
        build_prjoxide
      if: matrix.arch == 'nexus' && steps.cache-prjoxide.outputs.cache-hit != 'true'

    - name: Execute build nextpnr
      env:
        CCACHE_REMOTE_STORAGE: ${{ secrets.CCACHE_REMOTE_STORAGE }}
      run: |
        source ./.github/ci/build_${{ matrix.arch }}.sh
        get_dependencies
        build_nextpnr
        run_tests
        run_archcheck

  # Saves the Eigen 3.4.0 checkout that demos.yml builds nextpnr against.
  # demos never runs on a push to main (it runs on pull requests and by hand),
  # a pull request can restore a cache saved on main but not one saved by
  # another pull request, and gitlab.com turns clones away under load; saved
  # here on push, a pull request restores it instead of cloning.  The path,
  # the key and the commit are the ones in demos.yml.
  Cache-eigen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EIGEN_COMMIT: 3147391d946bb4b6c68edd901f2add6ac1f31f8c
    steps:
    - name: Cache the Eigen 3.4.0 checkout
      uses: actions/cache@v4
      id: cache-eigen
      with:
        path: /tmp/eigen
        key: cache-eigen-3.4.0-${{ env.EIGEN_COMMIT }}-r1

    - name: Clone Eigen 3.4.0
      run: |
        for try in 1 2 3 4; do
          git clone --depth 1 --branch 3.4.0 https://gitlab.com/libeigen/eigen.git /tmp/eigen && break
          if [ "$try" = 4 ]; then exit 1; fi
          sleep 60
        done
      if: steps.cache-eigen.outputs.cache-hit != 'true'

    - name: Check the Eigen commit
      run: |
        head=$(git -C /tmp/eigen rev-parse HEAD)
        echo "Eigen checkout: $head"
        if [ "$head" != "$EIGEN_COMMIT" ]; then
          echo "::error::Eigen checkout is $head, not 3.4.0 ($EIGEN_COMMIT)"
          exit 1
        fi

  # Saves the .debs for every apt list these workflows install.  demos and
  # regression do not run on a push to main, and a pull request can restore
  # a cache saved on main but not one saved by another pull request, so the
  # lists are saved here.  Each list is the file the installing job reads.
  Cache-apt:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - list: apt-arch.list
            cache: apt-arch
          - list: apt-demos-build.list
            cache: apt-demos-build
          - list: apt-demos-yosys.list
            cache: apt-demos-yosys
          - list: apt-regression.list
            cache: apt-regression
    steps:
    - uses: actions/checkout@v4

    - name: Apt cache key
      id: apt-key
      timeout-minutes: 10
      run: .github/ci/apt-install.sh key ".github/ci/${{ matrix.list }}"

    - name: Restore apt packages
      id: apt-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/${{ matrix.cache }}
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-key.outputs.prefix-image }}
          ${{ steps.apt-key.outputs.prefix-os }}

    - name: Install
      timeout-minutes: 35
      run: .github/ci/apt-install.sh install ".github/ci/${{ matrix.list }}" "${{ runner.temp }}/${{ matrix.cache }}"

    - name: Save apt packages
      if: steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/${{ matrix.cache }}
        key: ${{ steps.apt-key.outputs.key }}
